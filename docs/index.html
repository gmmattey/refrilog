<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Suporte e privacidade do RefriLog." />
    <title>RefriLog — Suporte e privacidade</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #12324d;
        background: #eef8ff;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        width: min(100%, 640px);
        background: #fff;
        border-radius: 24px;
        padding: 40px;
        box-shadow: 0 18px 50px rgba(32, 106, 158, 0.14);
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 7vw, 3.25rem);
        letter-spacing: -0.05em;
      }
      p {
        color: #526b80;
        font-size: 1.1rem;
        line-height: 1.6;
      }
      nav {
        display: grid;
        gap: 12px;
        margin-top: 28px;
      }
      a {
        display: block;
        border: 1px solid #b7dcf5;
        border-radius: 14px;
        color: #0b71b9;
        font-weight: 700;
        padding: 16px;
        text-decoration: none;
      }
      a:hover {
        background: #f2faff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>RefriLog</h1>
      <p>Um diário simples para registrar refrigerantes no seu próprio ritmo.</p>
      <nav aria-label="Informações do RefriLog">
        <a href="./support/">Suporte</a>
        <a href="./privacy/">Política de privacidade</a>
      </nav>
    </main>
  </body>
</html>
